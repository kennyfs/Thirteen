# Tests the C++ engine and the Android app, and takes the app's screenshots, when started by hand: the same checks run
# locally (android/build-apk.sh, android/device-tests.sh), which also build the APK.
name: android

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: 8.11.1

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the engine (no ONNX Runtime)
        run: |
          cmake -S cpp -B cpp/build -DUSE_NATIVE=OFF
          cmake --build cpp/build -j4
          cpp/build/thirteen runtests
          echo '{"cmd":"rows","rows":[[0,1,2],[48,49,50,51,4],[8,12,16,20,24]]}' | cpp/build/thirteen gui
          # Rows like a candidate's but with two eights swapped take its place, not an extra dominated one.
          echo '{"cmd":"analyze","hand":[5,9,10,13,18,21,23,24,26,30,35,41,51],"extra":[[[51,24,10],[35,30,26,23,18],[41,21,13,9,5]]]}' | cpp/build/thirteen gui | grep -v '"extra":true'

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build and unit-test
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=io.github.kennyfs.thirteen.ScreenshotTest

  # Every screen under several screen, display and font sizes (ScreenshotTest): the screenshots are an artifact to look
  # over, and the test fails if a card is cut off at the side. Android 14 for its nonlinear font scaling.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          # A display as large as the largest size tried: wm size cannot go beyond it.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1600x2600
          disable-animations: true
          working-directory: android
          script: |
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.kennyfs.thirteen.ScreenshotTest || touch ../screenshots-failed
            adb pull /data/local/tmp/shots ../screenshots
            adb logcat -d -s ScreenshotTest TestRunner > ../screenshots/log.txt
            test ! -f ../screenshots-failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
